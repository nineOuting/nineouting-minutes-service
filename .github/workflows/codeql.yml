# GitHub CodeQL 코드 스캐닝 (보안 취약점 정적 분석). 기존 CI와 따로, 동시에 돈다.
# 빌드 없이 분석(build-mode: none)해서 공통 모듈 토큰이 필요 없고 빠르다.
name: CodeQL

on:
  pull_request:
    branches: [dev, stage, main]
  push:
    branches: [dev]
  schedule:
    - cron: '0 18 * * 0'   # 매주 월요일 03:00 (KST)

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
