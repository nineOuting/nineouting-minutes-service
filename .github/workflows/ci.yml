# Build and verify locally, then publish directly to DEV ECR.
name: CI
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trivy Dockerfile 보안 설정 검사
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_CONFIG: /dev/null
          TRIVY_IGNOREFILE: /dev/null
          TRIVY_SECRET_CONFIG: /dev/null
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: Dockerfile.ci
          format: json
          output: trivy-config-report.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
      - name: Trivy 설정 차단 기준 확인
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          data = json.loads(Path('trivy-config-report.json').read_text())
          findings = [m for r in (data.get('Results') or []) for m in (r.get('Misconfigurations') or [])]
          counts = {level: sum(m.get('Severity') == level for m in findings) for level in ('CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'UNKNOWN')}
          print('Trivy config findings: ' + ', '.join(f'{k}={v}' for k, v in counts.items()))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### Trivy Dockerfile/config scan\n\n' + '\n'.join(f'- {k}: {v}' for k, v in counts.items()) + '\n')
          sys.exit(1 if counts['CRITICAL'] or counts['HIGH'] else 0)
          PY
      - name: 보안 검사 결과 보관 - Dockerfile/config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-report
          path: trivy-config-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Test ECR publish failure paths (offline)
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary :all: coverage==7.10.6
          python3 -m coverage run --branch --source=.github/scripts .github/scripts/test_publish_dev_ecr.py
          python3 -m coverage xml -o python-coverage.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build jacocoTestReport --no-daemon --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
      - name: Package tested JAR
        run: |
          set -euo pipefail
          jars=(build/libs/*.jar)
          if [[ ${#jars[@]} -ne 1 || ! -s "${jars[0]}" ]]; then
            echo "Expected exactly one non-empty application JAR" >&2
            exit 1
          fi
          mkdir -p tested-application
          cp "${jars[0]}" tested-application/app.jar
          (cd tested-application && sha256sum app.jar > app.jar.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: tested-minutes-${{ github.run_id }}-${{ github.sha }}
          path: tested-application/
          retention-days: 1
  image:
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tested-minutes-${{ github.run_id }}-${{ github.sha }}
          path: tested-application
      - name: Verify tested JAR checksum
        run: (cd tested-application && sha256sum --check app.jar.sha256)
      - uses: docker/setup-buildx-action@v3
      - name: Build local image
        id: build_local_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64
          tags: nineouting-verified:local
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Verify image contains the tested JAR
        run: |
          set -euo pipefail
          container=$(docker create nineouting-verified:local)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/app/app.jar" image-app.jar
          cmp tested-application/app.jar image-app.jar
          echo "Built image contains the exact tested JAR"
      - name: Trivy 이미지 취약점 전체 결과
        if: always() && steps.build_local_image.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_CONFIG: /dev/null
          TRIVY_IGNOREFILE: /dev/null
          TRIVY_SECRET_CONFIG: /dev/null
        with:
          version: v0.76.2
          image-ref: nineouting-verified:local
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-image-vuln.json
          exit-code: '0'
      - name: Trivy 이미지 취약점 차단 기준 확인
        if: always() && steps.build_local_image.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          data = json.loads(Path('trivy-image-vuln.json').read_text())
          findings = [v for r in (data.get('Results') or []) for v in (r.get('Vulnerabilities') or [])]
          counts = {level: sum(v.get('Severity') == level for v in findings) for level in ('CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'UNKNOWN')}
          print('Trivy image vulnerabilities: ' + ', '.join(f'{k}={v}' for k, v in counts.items()))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### Trivy image vulnerability scan\n\n' + '\n'.join(f'- {k}: {v}' for k, v in counts.items()) + '\n')
          sys.exit(1 if counts['CRITICAL'] or counts['HIGH'] else 0)
          PY
      - name: Trivy 이미지 비밀정보 검사
        if: always() && steps.build_local_image.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_CONFIG: /dev/null
          TRIVY_IGNOREFILE: /dev/null
          TRIVY_SECRET_CONFIG: /dev/null
        with:
          version: v0.76.2
          skip-setup-trivy: true
          image-ref: nineouting-verified:local
          scanners: secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-secret-raw.json
          exit-code: '0'
      - name: 비밀정보 검사 결과 요약 및 차단
        if: always() && steps.build_local_image.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          raw = Path('trivy-secret-raw.json')
          data = json.loads(raw.read_text())
          findings = [
              {'target': r.get('Target', ''), 'rule_id': s.get('RuleID', ''), 'category': s.get('Category', ''), 'severity': s.get('Severity', '')}
              for r in (data.get('Results') or []) for s in (r.get('Secrets') or [])
          ]
          Path('trivy-secret-summary.json').write_text(json.dumps({'finding_count': len(findings), 'findings': findings}, indent=2) + '\n')
          raw.unlink(missing_ok=True)
          print(f"Trivy image secret findings: {len(findings)} (secret values omitted)")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"### Trivy image secret scan\n\n- Findings: {len(findings)}\n- Secret values: omitted\n")
          sys.exit(1 if findings else 0)
          PY
      - name: Trivy 검사 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: |
            trivy-image-vuln.json
            trivy-secret-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Save exact built image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: docker save nineouting-verified:local | gzip > verified-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        with:
          name: verified-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-image.tar.gz
          retention-days: 1
          if-no-files-found: error
  dev-ecr:
    name: Verify and publish DEV ECR image
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      EXPECTED_ACCOUNT: '443845329525'
      TARGET_IMAGE: 443845329525.dkr.ecr.ap-northeast-2.amazonaws.com/nineouting-dev-minutes
      LOCAL_IMAGE: nineouting-verified:local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-image-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Load verified image
        run: gunzip -c verified-image.tar.gz | docker load
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to DEV with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::443845329525:role/nineouting-dev-minutes-github
          aws-region: ap-northeast-2
          role-session-name: gha-${{ github.run_id }}
      - name: Check account
        shell: bash
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          test "$account" = "$EXPECTED_ACCOUNT"
          echo "AWS account verified: $account"
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Publish and verify exact local image in DEV ECR
        id: publish
        run: bash .github/scripts/publish-dev-ecr.sh
      - name: Save verified image reference
        uses: actions/upload-artifact@v4
        with:
          name: dev-ecr-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image-result.txt
            ecr-manifest.txt
            ecr-manifest-raw.json
          retention-days: 30
  dev-gitops:
    needs: dev-ecr
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: dev-gitops-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nineOuting/nineouting-infra
          ref: dev
          token: ${{ secrets.DEV_GITOPS_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dev-ecr-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-image
      - name: 검증된 DEV 이미지 PR 생성
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEV_GITOPS_TOKEN: ${{ secrets.DEV_GITOPS_TOKEN }}
        run: python3 scripts/dev/promote-image.py
  # 버전 릴리스 (2026-11-27). DEV 이미지마다 <다음 정식 버전>-dev.<순번> 사전 릴리스, ECR 이미지에도 같은 태그
  dev-release:
    name: DEV 버전 릴리스
    needs: dev-ecr
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    env:
      AWS_REGION: ap-northeast-2
      TARGET_IMAGE: 443845329525.dkr.ecr.ap-northeast-2.amazonaws.com/nineouting-dev-minutes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dev-ecr-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-image
      - name: Authenticate to DEV with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::443845329525:role/nineouting-dev-minutes-github
          aws-region: ap-northeast-2
          role-session-name: gha-release-${{ github.run_id }}
      - name: 버전 태그와 사전 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh dev
  # main 머지마다 정식 버전 (v1.0.0부터 패치 번호 +1). 운영 서버 준비 전이라 이미지는 만들지 않는다
  release:
    name: 정식 버전 릴리스
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 정식 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh main
'on':
  pull_request:
    branches:
      - dev
      - stage
      - main
  push:
    branches:
      - dev
      - stage
      - main
  workflow_dispatch: null
