server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: minutes-service
  config:
    import: classpath:observability/defaults.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5437/minutes_db}
    username: ${DB_USERNAME:minutes_service}
    password: ${DB_PASSWORD:minutes_service}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway만 바꾼다
nineouting:
  # 이벤트는 SNS로 보내고 서비스 큐(SQS)로 받는다. 자격 증명은 AWS SDK 기본 방식 (EKS는 IRSA, 로컬은 LocalStack)
  messaging:
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ${AWS_ENDPOINT_URL:}          # 비우면 AWS. 로컬은 LocalStack (http://localhost:4566)
    access-key: ${MESSAGING_ACCESS_KEY:}    # 비우면 AWS 기본 자격 증명. LocalStack은 test
    secret-key: ${MESSAGING_SECRET_KEY:}
  outbox:
    topic-prefix: ${SNS_TOPIC_PREFIX:arn:aws:sns:ap-northeast-2:000000000000:nineouting-local-}
  security:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  inbox:
    # 이 서비스 큐. 받는 이벤트는 SNS 구독이 정한다: meeting.finished, meeting.moved, workspace.folder-deleted
    queue: ${SQS_QUEUE_URL:http://localhost:4566/000000000000/nineouting-local-minutes-service.fifo}
  minutes:
    storage:                               # 양식 배경 이미지 (S3, REQ-157). 파일은 template-backgrounds/ 아래에 둔다
      bucket: ${STORAGE_BUCKET:nineouting-dev-files}
      region: ${AWS_REGION:ap-northeast-2}
      endpoint: ${STORAGE_ENDPOINT:}        # 비우면 AWS S3
      presign-endpoint: ${STORAGE_PRESIGN_ENDPOINT:}  # 브라우저에 줄 주소만 다를 때 (로컬 통합 환경)
      access-key: ${STORAGE_ACCESS_KEY:}    # 비우면 AWS 기본 자격 증명(Pod Identity 등)
      secret-key: ${STORAGE_SECRET_KEY:}
      upload-url-ttl: 5m
      download-url-ttl: 1h
    # AI 회의록 초안 (REQ-101~103). ai-service 주소를 비우면 요청하지 않는다
    draft:
      ai-service-url: ${AI_SERVICE_URL:}
      meeting-service-url: ${MEETING_SERVICE_URL:http://localhost:8083}
      callback-base-url: ${MINUTES_CALLBACK_BASE_URL:http://localhost:8084}   # ai-service가 결과를 보낼 이 서비스 주소
      # 오늘 회의 요약이 아직 없으면 기다렸다가 요청한다: 이 주기로 확인하고, 한도를 넘으면 실패(DRAFT_SOURCE_TIMEOUT)
      source-check-interval: 10s
      source-wait: 10m
      in-progress-guard: 2m   # 요청한 뒤 이 시간 안에는 다시 요청하지 못한다 (DRAFT_IN_PROGRESS)
    rag:
      # REQ-185 작성 완료 회의록을 챗봇 검색용 저장소에 넣는다. ai-service, 콜백 주소는 위 draft 설정을 같이 쓴다 (docs/services/rag-chatbot.md)
      send-interval: 5s
      max-attempts: 5
      retry-delay: 30s         # 실패할 때마다 두 배
      accepted-timeout: 10m    # 접수 뒤 콜백이 이만큼 없으면 상태 조회
  clients:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
    workspace-service-url: ${WORKSPACE_SERVICE_URL:http://localhost:8082}
